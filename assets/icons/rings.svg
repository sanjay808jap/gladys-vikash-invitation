<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 20" fill="none">
  <defs>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B4E"/>
      <stop offset="50%" stop-color="#F2DFAC"/>
      <stop offset="100%" stop-color="#A07228"/>
    </linearGradient>
  </defs>
  <!-- Left Ring -->
  <circle cx="10" cy="10" r="7.5" stroke="url(#ringGold)" stroke-width="2.2" fill="none"/>
  <!-- Right Ring Interlocking -->
  <circle cx="18" cy="10" r="7.5" stroke="url(#ringGold)" stroke-width="2.2" fill="none"/>
  <!-- Overlap highlight -->
  <path d="M14 4.5 C15.5 6 16.5 8 16.5 10 C16.5 12 15.5 14 14 15.5" stroke="url(#ringGold)" stroke-width="2.2" fill="none"/>
</svg>
