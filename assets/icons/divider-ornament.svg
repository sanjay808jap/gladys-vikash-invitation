      <stop offset="0%" stop-color="#C59B4E" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#C59B4E" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#E2C988"/>
      <stop offset="75%" stop-color="#C59B4E" stop-opacity="0.7"/>
